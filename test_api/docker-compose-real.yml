version: '3'

services:
  lux-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - DOWNLOAD_DIR=/app/downloads
      - MAX_CONCURRENT_DOWNLOADS=5
      - DOWNLOAD_TIMEOUT=3600
      - FILE_EXPIRY_TIME=86400
      - RATE_LIMIT=60
    volumes:
      - ../downloads:/app/downloads